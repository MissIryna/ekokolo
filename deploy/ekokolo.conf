# nginx vhost — ekokolo.pp.ua
#
# Поруч живуть menuger-production.conf, menuger-staging.conf і
# catch-all.conf. Усі імена тут (log_format, zone, upstream) з префіксом
# ekokolo, бо файли підключені в той самий http і імена мусять бути
# унікальними.
#
# ВСТАНОВЛЕННЯ (лише ПІСЛЯ того, як certbot видав сертифікат — інакше
# nginx -t впаде на відсутньому ssl_certificate):
#     sudo cp deploy/ekokolo.conf /etc/nginx/sites-available/
#     sudo ln -s /etc/nginx/sites-available/ekokolo.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx

log_format ekokolo_timed '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time urt=$upstream_response_time';

# Цифри взяті зі стелі (див. «Відкриті питання» в CLAUDE.md). Увага:
# рій на сходинах часто сидить за одним Wi-Fi, тобто за однією IP-адресою.
# Якщо в логах з'являться 429 від своїх — піднімати burst.
limit_req_zone $binary_remote_addr zone=ekokolo_api:1m rate=5r/s;

upstream ekokolo_puma {
    server unix:///home/deploy/ekokolo/tmp/puma.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name ekokolo.pp.ua;
    return 301 https://ekokolo.pp.ua$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ekokolo.pp.ua;

    ssl_certificate     /etc/letsencrypt/live/ekokolo.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekokolo.pp.ua/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ekokolo_SSL:1m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/ekokolo_access.log ekokolo_timed;
    error_log  /var/log/nginx/ekokolo_error.log;

    # root — це сам клон репозиторію, а в ньому лежать .env з паролем бази,
    # app.rb, CLAUDE.md. Тому жодного загального try_files: назовні виходять
    # лише сторінка гри і /api, решта — 404.
    root /home/deploy/ekokolo;

    # index-api.html — версія гри під цей API, поки в репо вона ще під
    # перехідною назвою. Коли її перейменують на index.html, цей рядок
    # підхопить новий файл сам, без правки конфіга.
    location = / {
        try_files /index-api.html /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        limit_req        zone=ekokolo_api burst=20 nodelay;
        limit_req_status 429;

        # Те саме обмеження, що й MAX_BODY в app.rb.
        client_max_body_size 64k;

        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host              $http_host;
        proxy_redirect   off;
        proxy_pass       http://ekokolo_puma;
    }

    location / {
        return 404;
    }
}
