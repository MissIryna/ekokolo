<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Коло добрих справ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --page:#F7EFDF; --card:#FFFCF4; --ink:#3B2718; --muted:#7A6450;
  --line:rgba(59,39,24,.16); --accent:#C8791F; --accent2:#7C3A52;
  --foil:#C9C4BB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}

body[data-season="autumn"]{--page:#F7EBD3;--card:#FFFCF4;--ink:#3B2718;--muted:#7A6450;--line:rgba(59,39,24,.16);--accent:#C8791F;--accent2:#8A3350}
body[data-season="winter"]{--page:#E6EFF5;--card:#FBFDFF;--ink:#1D3546;--muted:#5C7689;--line:rgba(29,53,70,.16);--accent:#3D82AD;--accent2:#C9962B}
body[data-season="spring"]{--page:#E9F4D9;--card:#FCFEF7;--ink:#22401F;--muted:#5C7452;--line:rgba(34,64,31,.16);--accent:#5C9E33;--accent2:#D2568C}
body[data-season="summer"]{--page:#FDF2CE;--card:#FFFDF2;--ink:#2E4519;--muted:#6E7A4C;--line:rgba(46,69,25,.16);--accent:#2F9C86;--accent2:#E5602F}

@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]) body{--page:#171310;--card:#221B16;--ink:#F1E7D9;--muted:#A99686;--line:rgba(241,231,217,.18);--foil:#514A42}
}
html[data-theme="dark"] body{--page:#171310;--card:#221B16;--ink:#F1E7D9;--muted:#A99686;--line:rgba(241,231,217,.18);--foil:#514A42}

/* ---------- base ---------- */
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:Manrope,"Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.55;
  transition:background-color .45s ease, color .45s ease;
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;font-weight:600;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;border-radius:6px}

.wrap{max-width:980px;margin:0 auto;padding:22px 18px 80px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.brand h1{font-size:clamp(26px,6vw,40px);font-weight:800;letter-spacing:-.02em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:15px;max-width:44ch}
.me{display:flex;gap:8px;flex-wrap:wrap}
.me input{
  font:inherit;font-size:14px;padding:9px 12px;width:150px;
  background:var(--card);color:var(--ink);
  border:2px solid var(--line);border-radius:12px;
}
.me input::placeholder{color:var(--muted)}

/* ---------- year wheel ---------- */
.wheel{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin:26px 0 8px}
.wheel svg{width:230px;height:230px;flex:none;display:block}
.seg{cursor:pointer}
.seg .track{stroke:var(--line);fill:none;stroke-width:28;stroke-linecap:round}
.seg .fill{fill:none;stroke-width:28;stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.22,1,.36,1)}
.seg .hit{stroke:transparent;fill:none;stroke-width:44}
.seg text{font-size:19px;text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
.seg[aria-current="true"] .track{stroke:var(--line);stroke-width:34}
.seg[aria-current="true"] .fill{stroke-width:34}
.hubn{font-family:Unbounded;font-weight:800;font-size:23px;fill:var(--ink);text-anchor:middle}
.hubl{font-size:11px;fill:var(--muted);text-anchor:middle;letter-spacing:.06em}

.now{flex:1 1 240px;min-width:220px}
.now h2{font-size:clamp(22px,5vw,30px);font-weight:800}
.now .line{color:var(--muted);margin:8px 0 14px;font-size:15px;max-width:40ch}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  padding:6px 11px;border-radius:999px;border:2px dashed var(--line);color:var(--muted);
}
.badge.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:22px}
.deed{
  position:relative;background:var(--card);border:2px solid var(--line);
  border-radius:20px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:9px;
}
.deed.done{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.cat{padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent2) 15%,transparent);color:var(--accent2)}
.leaves{margin-left:auto;letter-spacing:1px;font-size:12px}
.deed h3{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.deed p{margin:0;font-size:14.5px;color:var(--muted)}
.deed .go{
  margin-top:auto;border:none;border-radius:13px;padding:11px 14px;font-weight:700;font-size:14.5px;
  background:var(--accent);color:#fff;transition:transform .12s ease;
}
.deed .go:active{transform:scale(.97)}
.deed .undo{margin-top:auto;border:2px solid var(--line);background:transparent;border-radius:13px;padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.stick{position:absolute;top:-12px;right:12px;font-size:34px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}

/* ---------- panels ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.tools button{
  background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:11px 16px;font-weight:700;font-size:14.5px;
}
.tools button[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.panel{margin-top:14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.panel h3{font-size:18px;margin-bottom:4px}
.panel .hint{color:var(--muted);font-size:14px;margin:6px 0 14px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.slot{aspect-ratio:1;display:grid;place-items:center;font-size:25px;border-radius:14px;border:2px dashed var(--line)}
.slot.got{border-style:solid;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.rank{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .n{width:22px;color:var(--muted);font-weight:700;font-size:14px}
.row .who{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grp{color:var(--muted);font-size:13px}
.row .cnt{font-family:Unbounded;font-weight:600;font-size:15px;color:var(--accent)}
.row.self{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:12px;padding-left:8px;padding-right:8px}

/* ---------- scratch modal ---------- */
.veil{position:fixed;inset:0;background:rgba(20,12,6,.62);display:grid;place-items:center;padding:20px;z-index:50}
.veil[hidden]{display:none}
.sheet{
  background:var(--card);border-radius:26px;padding:22px;width:min(420px,100%);
  border:2px solid var(--line);text-align:center;
}
.sheet h3{font-size:19px;margin-bottom:6px}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.scratchbox{position:relative;border-radius:18px;overflow:hidden;background:var(--page);border:2px solid var(--line)}
.prize{padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.prize .em{font-size:60px;line-height:1}
.prize .fact{font-size:14.5px;color:var(--muted);max-width:32ch}
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.sheet .row2{display:flex;gap:9px;margin-top:15px}
.sheet .row2 button{flex:1;border-radius:14px;padding:11px;font-weight:700;font-size:14.5px;border:2px solid var(--line);background:transparent}
.sheet .row2 .prim{background:var(--accent);color:#fff;border-color:var(--accent)}

.foot{margin-top:40px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body data-season="autumn">
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>Коло добрих справ</h1>
      <p>П'ятдесят справ для природи — по колу цілого пластового року. Виконав справу — зітри поле й забери наліпку.</p>
    </div>
    <div class="me">
      <input id="nick" placeholder="Твоє прізвисько" maxlength="24" autocomplete="off">
      <input id="grp" placeholder="Мій рій" maxlength="24" autocomplete="off">
    </div>
  </header>

  <section class="wheel">
    <svg id="wheel" viewBox="0 0 230 230" role="group" aria-label="Коло року"></svg>
    <div class="now">
      <h2 id="sname">Осінь</h2>
      <p class="line" id="sline"></p>
      <div class="badges" id="badges"></div>
    </div>
  </section>

  <div class="grid" id="grid"></div>

  <div class="tools">
    <button id="tAlbum" aria-expanded="false">Мої наліпки</button>
    <button id="tBoard" aria-expanded="false">Табло роїв</button>
  </div>
  <section class="panel" id="pAlbum" hidden>
    <h3 id="albumTitle">Мої наліпки</h3>
    <p class="hint" id="albumHint"></p>
    <div class="album" id="album"></div>
  </section>
  <section class="panel" id="pBoard" hidden>
    <h3>Табло роїв</h3>
    <p class="hint" id="boardHint">Тут видно, як просувається все гніздо.</p>
    <div class="rank" id="board"></div>
  </section>

  <p class="foot">Прототип гри для новацтва. Готуйсь!</p>
</div>

<div class="veil" id="veil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">Зроблено!</h3>
    <p class="sub" id="mSub">Зітри поле пальцем — там на тебе чекає наліпка.</p>
    <div class="scratchbox">
      <div class="prize">
        <div class="em" id="mEm">🌿</div>
        <div class="fact" id="mFact"></div>
      </div>
      <canvas id="scratch" aria-label="Поле для стирання"></canvas>
    </div>
    <div class="row2">
      <button id="mReveal">Показати відразу</button>
      <button id="mClose" class="prim">Готово</button>
    </div>
  </div>
</div>

{s:"spring",c:"Живе",lv:3,e:"🐝",t:"Готель для комах",d:"Зроби з паличок і трубочок домівку для диких бджіл.",f:"Дикі бджоли запилюють рослини краще за домашніх."},
{s:"spring",c:"Сміття",lv:2,e:"♻️",t:"Тиждень сортування",d:"Цілий тиждень сортуй сміття вдома сам, без підказок.",f:"Відсортоване сміття — це вже не сміття, а сировина."},
{s:"spring",c:"Речі",lv:2,e:"🧰",t:"Полагодь, не викидай",d:"Пришийте ґудзик, підклейте книжку, полагодьте іграшку.",f:"Найекологічніша річ — та, яку ти не купив."},
{s:"spring",c:"Люди",lv:3,e:"📖",t:"Гутірка про свій вид",d:"Обери тварину з Червоної книги України й розкажи про неї своєму роєві.",f:"У Червоній книзі України — понад дві тисячі видів рослин і тварин."},
{s:"spring",c:"Речі",lv:2,e:"🚫",t:"День без пластику",d:"Проживи цілий день, не взявши жодної нової пластикової речі.",f:"Спробуй порахувати, скільки разів за день ти торкаєшся пластику."},
{s:"spring",c:"Люди",lv:3,e:"🔁",t:"Обмінна толока",d:"Влаштуйте в гнізді обмін книжками, іграшками чи одягом.",f:"Річ, що знайшла нового власника, — це річ, яку не довелося виробляти."},

{s:"summer",c:"Речі",lv:2,e:"🍶",t:"Своя пляшка",d:"Цілий табір пий зі своєї пляшки, не купуючи води в пластику.",f:"Одна багаторазова пляшка замінює за літо сотні одноразових."},
{s:"summer",c:"Сміття",lv:2,e:"⛺",t:"Чистіше, ніж було",d:"Іди з місця ночівлі, залишивши його чистішим, ніж ти його знайшов.",f:"Це головне правило кожного мандрівника."},
{s:"summer",c:"Люди",lv:3,e:"🤝",t:"Навчи меншого",d:"Покажи молодшому пластунові, як сортувати сміття в таборі.",f:"Те, що ти пояснив іншому, ти запам'ятовуєш найкраще."},
{s:"summer",c:"Сміття",lv:1,e:"🏖️",t:"Перевір за собою",d:"Після купання обійди своє місце й перевір, чи нічого не лишилось.",f:"Один недопалок отруює близько літра води."},
{s:"summer",c:"Живе",lv:2,e:"🫐",t:"Обережні ноги",d:"Збирай ягоди чи трави стежкою, не витоптуючи галявину.",f:"Витоптана галявина відновлюється кілька років."},
{s:"summer",c:"Живе",lv:2,e:"🦋",t:"Десять комах",d:"Сфотографуй десять різних комах. Жодної не чіпай руками.",f:"Комах на Землі більше, ніж усіх інших тварин разом узятих."},
{s:"summer",c:"Речі",lv:3,e:"🍽️",t:"Табір без одноразового",d:"Тиждень у таборі — зі своїм посудом, без пластикових тарілок.",f:"Одноразову тарілку використовують десять хвилин."},
{s:"summer",c:"Вода",lv:1,e:"🌅",t:"Полив на світанку",d:"Полий рослини рано вранці або ввечері, а не опівдні.",f:"Удень до коренів доходить менше половини води — решта випаровується."},
{s:"summer",c:"Енергія",lv:2,e:"👟",t:"П'ять кілометрів",d:"Пройди п'ять кілометрів пішки там, де зазвичай їдеш.",f:"Пішохід не витрачає жодної краплі пального."},
{s:"summer",c:"Речі",lv:2,e:"🥕",t:"Торбинка для городини",d:"Зроби тканинні мішечки й ходіть із ними на базар.",f:"Овочі в тканині дихають і довше не псуються."},
{s:"summer",c:"Люди",lv:2,e:"🚰",t:"Звідки твоя вода",d:"Дізнайся, з якої річки чи свердловини п'є твоє місто, і розкажи вдома.",f:"Майже кожне українське місто п'є з конкретної річки. Знайди назву своєї."},
{s:"summer",c:"Енергія",lv:2,e:"🌿",t:"День без екрана",d:"Проведи цілий день на природі, не вмикаючи телефон.",f:"Очам потрібно дивитися вдалечінь — на дерева, небо, обрій."}
];
D.forEach((d,i)=>d.id="d"+(i+1));

const SEASONS={
  autumn:{n:"Осінь",e:"🍂",l:"Пластовий рік починається восени. Твої добрі справи — теж."},
  winter:{n:"Зима",e:"❄️",l:"Узимку природі найважче. Саме тоді ти найпотрібніший."},
  spring:{n:"Весна",e:"🌿",l:"Усе прокидається. Час садити, будувати й прибирати."},
  summer:{n:"Літо",e:"☀️",l:"Табори, ріки, мандрівки. Залиш після себе чисто."}
};
const ORDER=["autumn","winter","spring","summer"];
const ARC={autumn:[4,86],winter:[94,176],spring:[184,266],summer:[274,356]};

/* ============ стан ============ */
const KEY="ekolo.v1";
let st={nick:"",grp:"",done:{}};
let cur="autumn";

function load(){ try{ const r=localStorage.getItem(KEY); if(r) st=Object.assign(st,JSON.parse(r)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
const total=()=>Object.keys(st.done).length;
const seasonDone=s=>D.filter(d=>d.s===s&&st.done[d.id]).length;
const seasonAll=s=>D.filter(d=>d.s===s).length;

/* ============ коло року ============ */
const NS="http://www.w3.org/2000/svg";
function pol(cx,cy,r,a){const t=(a-90)*Math.PI/180;return[cx+r*Math.cos(t),cy+r*Math.sin(t)];}
function arc(cx,cy,r,a1,a2){
  const[x1,y1]=pol(cx,cy,r,a1),[x2,y2]=pol(cx,cy,r,a2);
  return`M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${a2-a1>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
function buildWheel(){
  const sv=document.getElementById("wheel"); sv.innerHTML="";
  const C=115,R=78;
  ORDER.forEach(s=>{
    const[a1,a2]=ARC[s], g=document.createElementNS(NS,"g");
    g.setAttribute("class","seg"); g.setAttribute("role","button"); g.setAttribute("tabindex","0");
    g.setAttribute("aria-label",SEASONS[s].n);
    const p=arc(C,C,R,a1,a2);
    const tr=document.createElementNS(NS,"path");
    tr.setAttribute("d",p); tr.setAttribute("class","track");
    const fl=document.createElementNS(NS,"path");
    fl.setAttribute("d",p); fl.setAttribute("class","fill"); fl.setAttribute("pathLength","100");
    fl.setAttribute("stroke","var(--accent)"); fl.dataset.fill=s;
    const ht=document.createElementNS(NS,"path");
    ht.setAttribute("d",p); ht.setAttribute("class","hit");
    const[ex,ey]=pol(C,C,R,(a1+a2)/2);
    const tx=document.createElementNS(NS,"text");
    tx.setAttribute("x",ex); tx.setAttribute("y",ey); tx.textContent=SEASONS[s].e;
    g.append(tr,fl,ht,tx); g.addEventListener("click",()=>pick(s));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick(s);}});
    sv.appendChild(g);
  });
  const n=document.createElementNS(NS,"text");
  n.setAttribute("class","hubn"); n.setAttribute("x",C); n.setAttribute("y",C-2); n.id="hubn";
  const l=document.createElementNS(NS,"text");
  l.setAttribute("class","hubl"); l.setAttribute("x",C); l.setAttribute("y",C+18); l.textContent="із 50 справ";
  sv.append(n,l);
}
function paintWheel(){
  ORDER.forEach(s=>{
    const el=document.querySelector(`[data-fill="${s}"]`);
    const pct=Math.round(seasonDone(s)/seasonAll(s)*100);
    el.setAttribute("stroke-dasharray",`${pct} 100`);
    el.closest(".seg").setAttribute("aria-current",String(s===cur));
  });
  document.getElementById("hubn").textContent=total();
}

/* ============ рендер ============ */
function pick(s){ cur=s; document.body.dataset.season=s; render(); }

function render(){
  document.getElementById("sname").textContent=SEASONS[cur].n+" · "+seasonDone(cur)+" з "+seasonAll(cur);
  document.getElementById("sline").textContent=SEASONS[cur].l;
  paintWheel(); renderBadges(); renderGrid(); renderAlbum();
}
function renderBadges(){
  const b=document.getElementById("badges"); b.innerHTML="";
  ORDER.forEach(s=>{
    const full=seasonDone(s)===seasonAll(s);
    const el=document.createElement("span");
    el.className="badge"+(full?" on":"");
    el.textContent=SEASONS[s].e+" "+SEASONS[s].n+(full?" пройдена":"");
    b.appendChild(el);
  });
}
function renderGrid(){
  const g=document.getElementById("grid"); g.innerHTML="";
  D.filter(d=>d.s===cur).forEach(d=>{
    const done=!!st.done[d.id];
    const c=document.createElement("article");
    c.className="deed"+(done?" done":"");
    const m=document.createElement("div"); m.className="meta";
    const cat=document.createElement("span"); cat.className="cat"; cat.textContent=d.c;
    const lv=document.createElement("span"); lv.className="leaves";
    lv.textContent="🍃".repeat(d.lv); lv.title="Складність: "+d.lv+" з 3";
    m.append(cat,lv);
    const h=document.createElement("h3"); h.textContent=d.t;
    const p=document.createElement("p"); p.textContent=d.d;
    c.append(m,h,p);
    if(done){
      const s=document.createElement("div"); s.className="stick"; s.textContent=d.e; c.appendChild(s);
      const u=document.createElement("button"); u.className="undo"; u.textContent="Ще не зроблено";
      u.onclick=()=>{ delete st.done[d.id]; save(); sync(); render(); };
      c.appendChild(u);
    }else{
      const b=document.createElement("button"); b.className="go"; b.textContent="Зроблено!";
      b.onclick=()=>{ st.done[d.id]=Date.now(); save(); sync(); render(); openScratch(d); };
      c.appendChild(b);
    }
    g.appendChild(c);
  });
}
function renderAlbum(){
  const a=document.getElementById("album"); a.innerHTML="";
  D.forEach(d=>{
    const s=document.createElement("div");
    const got=!!st.done[d.id];
    s.className="slot"+(got?" got":"");
    s.textContent=got?d.e:"";
    s.title=got?d.t:"Ще попереду";
    a.appendChild(s);
  });
  document.getElementById("albumTitle").textContent=st.nick?"Наліпки "+st.nick:"Мої наліпки";
  document.getElementById("albumHint").textContent=
    total()===0?"Тут з'являтимуться наліпки. Перша — за першу виконану справу."
    :"Зібрано "+total()+" з 50. Залишилось "+(50-total())+".";
}

/* ============ скретч ============ */
const veil=document.getElementById("veil"), cv=document.getElementById("scratch");
let cx2=null, drawing=false, checked=0, activeDeed=null;

function openScratch(d){
  activeDeed=d;
  document.getElementById("mEm").textContent=d.e;
  document.getElementById("mFact").textContent=d.f;
  document.getElementById("mSub").textContent="Зітри поле пальцем — під ним наліпка.";
  veil.hidden=false;
  requestAnimationFrame(()=>{
    const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
    cx2=cv.getContext("2d"); cx2.scale(dpr,dpr);
    const foil=getComputedStyle(document.body).getPropertyValue("--foil").trim()||"#C9C4BB";
    cx2.fillStyle=foil; cx2.fillRect(0,0,r.width,r.height);
    cx2.fillStyle="rgba(255,255,255,.35)";
    for(let i=0;i<220;i++){
      cx2.fillRect(Math.random()*r.width,Math.random()*r.height,Math.random()*3+1,Math.random()*3+1);
    }
    cx2.fillStyle="rgba(0,0,0,.45)"; cx2.font="600 14px Manrope,sans-serif"; cx2.textAlign="center";
    cx2.fillText("зітри мене",r.width/2,r.height/2+5);
    cv.style.opacity="1"; checked=0;
  });
}
function scratchAt(ev){
  if(!cx2)return;
  const r=cv.getBoundingClientRect();
  const x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
  const y=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;
  cx2.globalCompositeOperation="destination-out";
  cx2.beginPath(); cx2.arc(x,y,20,0,Math.PI*2); cx2.fill();
  if(++checked%9===0)testDone();
}
function testDone(){
  const d=cx2.getImageData(0,0,cv.width,cv.height).data;
  let clear=0,n=0;
  for(let i=3;i<d.length;i+=4*12){ n++; if(d[i]===0)clear++; }
  if(clear/n>0.5)reveal();
}
function reveal(){ cv.style.transition="opacity .5s ease"; cv.style.opacity="0"; drawing=false; }
cv.addEventListener("pointerdown",e=>{drawing=true;cv.setPointerCapture(e.pointerId);scratchAt(e);});
cv.addEventListener("pointermove",e=>{if(drawing)scratchAt(e);});
cv.addEventListener("pointerup",()=>{drawing=false;testDone&&cx2&&testDone();});
cv.addEventListener("pointercancel",()=>{drawing=false;});
document.getElementById("mReveal").onclick=reveal;
document.getElementById("mClose").onclick=()=>{veil.hidden=true;activeDeed=null;};
veil.addEventListener("click",e=>{if(e.target===veil)veil.hidden=true;});
document.addEventListener("keydown",e=>{if(e.key==="Escape")veil.hidden=true;});

/* ============ панелі ============ */
function toggle(btn,pan){
  btn.onclick=()=>{
    const open=pan.hidden;
    pan.hidden=!open; btn.setAttribute("aria-expanded",String(open));
    if(open)pan.scrollIntoView({behavior:"smooth",block:"nearest"});
  };
}
toggle(document.getElementById("tAlbum"),document.getElementById("pAlbum"));
toggle(document.getElementById("tBoard"),document.getElementById("pBoard"));

/* ============ профіль ============ */
const nick=document.getElementById("nick"), grp=document.getElementById("grp");
let tmr=null;
function onEdit(){
  st.nick=nick.value.trim(); st.grp=grp.value.trim(); save();
  clearTimeout(tmr); tmr=setTimeout(sync,900);
}
nick.addEventListener("input",onEdit); grp.addEventListener("input",onEdit);

/* ============ табло роїв ============ */
let DB=null,USER=null,UID=null,rows=[];
async function boot(){
  if(!window.claude||!window.claude.use)return offline("Табло працює у Claude — там усе гніздо бачить спільний поступ.");
  try{DB=await window.claude.use("db");}catch(e){DB=null;}
  try{USER=await window.claude.use("user");}catch(e){USER=null;}
  if(USER){try{UID=await USER.id();}catch(e){UID=null;}}
  if(!DB||!UID)return offline("Щоб з'явитися на таблі, відкрий сторінку зі свого облікового запису.");
  try{
    const snap=await DB.doc("data/users/"+UID+"/progress").get();
    if(snap.exists){
      const v=snap.data()||{};
      if(v.done&&typeof v.done==="object")st.done=Object.assign({},v.done,st.done);
      if(v.nick&&!st.nick)st.nick=String(v.nick).slice(0,24);
      if(v.grp&&!st.grp)st.grp=String(v.grp).slice(0,24);
      save(); nick.value=st.nick; grp.value=st.grp; render();
    }
  }catch(e){}
  DB.collection("troop").orderBy("count","desc").limit(60).onSnapshot(s=>{
    rows=s.docs.map(x=>Object.assign({id:x.id},x.data()));
    drawBoard();
  },()=>offline("Табло зараз недоступне. Твій власний поступ збережено."));
  sync();
}
function offline(msg){
  document.getElementById("boardHint").textContent=msg;
  const b=document.getElementById("board");
  b.innerHTML=""; const r=document.createElement("div");
  r.className="row self";
  const w=document.createElement("span"); w.className="who"; w.textContent=st.grp||"Твій рій";
  const g=document.createElement("span"); g.className="grp"; g.textContent="поки лише ти";
  const c=document.createElement("span"); c.className="cnt"; c.textContent=total();
  r.append(w,g,c); b.appendChild(r);
}
let syncing=false;
async function sync(){
  if(!DB||!UID||syncing)return;
  syncing=true;
  try{
    await DB.doc("data/users/"+UID+"/progress").set({done:st.done,nick:st.nick,grp:st.grp});
    await DB.collection("troop").doc(UID).set({count:total(),grp:st.grp});
  }catch(e){}
  syncing=false;
}
function plural(n){ return n===1?" новак":(n>=2&&n<=4)?" новаки":" новаків"; }
function drawBoard(){
  const b=document.getElementById("board"), hint=document.getElementById("boardHint");
  b.innerHTML="";
  const gr={};
  rows.forEach(r=>{
    const raw=(r.grp?String(r.grp):"").trim().slice(0,24);
    if(!raw)return;
    const k=raw.toLowerCase();
    if(!gr[k])gr[k]={name:raw,sum:0,n:0,mine:false};
    gr[k].sum+=Number(r.count)||0;
    gr[k].n++;
    if(r.id===UID)gr[k].mine=true;
  });
  const list=Object.values(gr).sort((a,c)=>c.sum-a.sum);
  if(!list.length){
    hint.textContent="Поки що порожньо. Впиши вгорі назву свого роя — і він з'явиться тут.";
    return;
  }
  hint.textContent="Скільки добрих справ зібрав кожен рій разом.";
  list.forEach((g,i)=>{
    const el=document.createElement("div");
    el.className="row"+(g.mine?" self":"");
    const n=document.createElement("span"); n.className="n"; n.textContent=(i+1);
    const w=document.createElement("span"); w.className="who"; w.textContent=g.name;
    const m=document.createElement("span"); m.className="grp"; m.textContent=g.n+plural(g.n);
    const c=document.createElement("span"); c.className="cnt"; c.textContent=g.sum;
    el.append(n,w,m,c); b.appendChild(el);
  });
}

/* ============ старт ============ */
load();
nick.value=st.nick; grp.value=st.grp;
buildWheel();
const m=new Date().getMonth();
cur = m>=8&&m<=10 ? "autumn" : (m===11||m<=1) ? "winter" : m<=4 ? "spring" : "summer";
document.body.dataset.season=cur;
render();
offline("Твій поступ збережено на цьому пристрої.");
boot();
</script>
</body>
</html>
